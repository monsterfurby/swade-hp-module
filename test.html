<!DOCTYPE html>
<html>
<head>
    <title>SWADE HP Module Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>SWADE HP Module Test</h1>
    
    <div class="test-section">
        <h2>Module Status</h2>
        <div id="module-status">Checking module status...</div>
    </div>
    
    <div class="test-section">
        <h2>HP Data Structure Test</h2>
        <div id="hp-data-test">Testing HP data structure...</div>
    </div>
    
    <div class="test-section">
        <h2>Template Test</h2>
        <div id="template-test">Testing template rendering...</div>
    </div>
    
    <script>
        // Simple test to verify the module is working
        function testModule() {
            const statusDiv = document.getElementById('module-status');
            const hpDataDiv = document.getElementById('hp-data-test');
            const templateDiv = document.getElementById('template-test');
            
            // Test 1: Check if module is loaded
            if (typeof SWADEHPSystem !== 'undefined') {
                statusDiv.innerHTML = '<span class="success">✓ SWADE HP Module is loaded</span>';
            } else {
                statusDiv.innerHTML = '<span class="error">✗ SWADE HP Module is not loaded</span>';
            }
            
            // Test 2: Check if Handlebars helper is registered
            if (typeof Handlebars !== 'undefined' && Handlebars.helpers && Handlebars.helpers.hpValue) {
                hpDataDiv.innerHTML = '<span class="success">✓ Handlebars helper is registered</span>';
            } else {
                hpDataDiv.innerHTML = '<span class="error">✗ Handlebars helper is not registered</span>';
            }
            
            // Test 3: Check if partial is registered
            if (typeof Handlebars !== 'undefined' && Handlebars.partials && Handlebars.partials['swade-hp-module.character-tab-summary']) {
                templateDiv.innerHTML = '<span class="success">✓ Template partial is registered</span>';
            } else {
                templateDiv.innerHTML = '<span class="error">✗ Template partial is not registered</span>';
            }
        }
        
        // Run test when page loads
        window.addEventListener('load', testModule);
    </script>
</body>
</html>
